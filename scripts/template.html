<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>senseofher__ claims index (private)</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--line:#e3e2dc;--card:#fff;--acc:#2f5d8a;
--own:#2f5d8a;--anon:#a35d00;--media:#2e7d4f;--doc:#6a3d9a;--third:#7a7a7a}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#9a9a93;--line:#2c2c2a;--card:#1f1f1d;--acc:#7fb0e0;--own:#7fb0e0;--anon:#e0a050;--media:#6cc08f;--doc:#b393dd;--third:#aaa}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;z-index:5}
header a{color:var(--fg);text-decoration:none;font-weight:600}header nav a{font-weight:500;color:var(--mut);margin-right:12px}
header input{flex:1;min-width:220px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
main{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--anon);padding:10px 14px;border-radius:6px;color:var(--mut);font-size:13.5px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;font-size:13.5px;color:var(--mut)}
.filters label{display:flex;gap:4px;align-items:center;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-decoration:none;color:var(--fg);display:block}
.pc:hover{border-color:var(--acc)}.pc b{display:block}.pc small{color:var(--mut)}
.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--line)}
.claim{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:8px 0}
.claim .meta{font-size:12.5px;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.claim q{display:block;margin-top:4px;color:var(--mut);font-style:italic;quotes:none}
.badge{font-size:11.5px;padding:1px 7px;border-radius:10px;color:#fff;white-space:nowrap}
.t-own{background:var(--own)}.t-anon{background:var(--anon)}.t-media{background:var(--media)}.t-doc{background:var(--doc)}.t-third{background:var(--third)}
.tag{font-size:12px;color:var(--acc);text-decoration:none}
h1{font-size:24px;margin:8px 0}h2{font-size:17px;margin:22px 0 8px}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:10px 0}.stats div b{font-size:22px;display:block}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}.slides img{width:100%;border-radius:4px;border:1px solid var(--line)}
a{color:var(--acc)}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);font-size:14px}
</style></head><body>
<header><a href="#/">Claims index</a><nav><a href="#/">People</a><a href="#/cats">Categories</a><a href="#/timeline">Timeline</a></nav>
<input id="q" type="search" placeholder="Search claims, quotes, people..."></header>
<main id="app"></main>
<script>
const D=/*DATA*/null;
const T={'her own claim':['own','Her claim'],'anonymous message she reposted':['anon','Anonymous repost'],'media report she shared':['media','Media report'],'official document she shared':['doc','Document'],'named third party she quoted':['third','Named third party']};
const st=new Set(Object.keys(T));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=encodeURIComponent;
function filters(){return '<div class="filters">Show: '+Object.entries(T).map(([k,[c,l]])=>`<label><input type="checkbox" data-st="${esc(k)}" ${st.has(k)?'checked':''}><span class="badge t-${c}">${l}</span></label>`).join('')+'</div>'}
function claimHTML(c){const [cl,l]=T[c.source_type]||['third',c.source_type];const p=D.posts[c.post]||{};
return `<div class="claim"><div class="meta"><span class="badge t-${cl}">${l}</span><span>${esc(c.date)}</span><a href="#/cat/${enc(c.category)}" class="tag">${esc(c.category)}</a>${c.people.map(n=>`<a class="tag" href="#/p/${enc(n)}">${esc(n)}</a>`).join(' ')}<a href="#/post/${c.post}" class="tag">post ${c.post}${c.slide?' slide '+c.slide:''}</a><a href="${esc(c.url)}" target="_blank" rel="noopener" class="tag">Instagram</a></div><div>${esc(c.claim)}</div>${c.quote?`<q>"${esc(c.quote)}"</q>`:''}</div>`}
function list(ids){const cs=ids.map(i=>D.claims[i]).filter(c=>st.has(c.source_type)).sort((a,b)=>b.date.localeCompare(a.date));return `<p style="color:var(--mut)">${cs.length} claims shown</p>`+cs.map(claimHTML).join('')}
function mix(ids){const n=ids.length,cnt={};ids.forEach(i=>{const k=D.claims[i].source_type;cnt[k]=(cnt[k]||0)+1});return '<div class="bar">'+Object.entries(T).map(([k,[c]])=>cnt[k]?`<span class="t-${c}" style="width:${cnt[k]/n*100}%"></span>`:'').join('')+'</div>'}
function home(){const ps=Object.entries(D.people).sort((a,b)=>b[1].n-a[1].n);const cs=D.claims;
const by=k=>cs.filter(c=>c.source_type===k).length;
return `<h1>Claims in @senseofher__ posts</h1><div class="note">Private working index. Every entry is a claim made or reposted in public Instagram posts by @senseofher__ (Dani LoCastro), 22 May to 27 Nov 2026. None of it has been verified. Two thirds are anonymous messages she reposted; at least one named person was said by another sender not to exist, and LoCastro herself said that submission might be false. Text was read from images by OCR and summarised automatically, so check the source post before relying on any entry.</div>
<div class="stats"><div><b>${cs.length}</b>claims</div><div><b>${Object.keys(D.posts).length}</b>posts</div><div><b>${by('her own claim')}</b>her own claims</div><div><b>${by('anonymous message she reposted')}</b>anonymous reposts</div><div><b>${ps.length}</b>people named</div></div>
<h2>People (by number of claims)</h2><div class="grid">${ps.map(([n,v])=>`<a class="pc" href="#/p/${enc(n)}"><b>${esc(n)}</b><small>${v.n} claim${v.n>1?'s':''}${v.role?' . '+esc(v.role):''}</small>${mix(v.ids)}</a>`).join('')}</div>`}
function person(n){const v=D.people[n];if(!v)return '<p>Not found</p>';return `<h1>${esc(n)}</h1><p style="color:var(--mut)">${esc(v.role)}</p><div class="note">These are allegations as posted or reposted on Instagram. They are unverified and the person named has not been asked to respond.</div>${filters()}${list(v.ids)}`}
function cats(){const c={};D.claims.forEach(x=>{(c[x.category]=c[x.category]||[]).push(x.id)});return '<h1>Categories</h1><table>'+Object.entries(c).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>`<tr><td><a href="#/cat/${enc(k)}">${esc(k)}</a></td><td>${v.length}</td><td style="width:40%">${mix(v)}</td></tr>`).join('')+'</table>'}
function cat(k){return `<h1>${esc(k)}</h1>${filters()}${list(D.claims.filter(c=>c.category===k).map(c=>c.id))}`}
function timeline(){const m={};D.claims.forEach(c=>{const w=c.date.slice(0,7);(m[w]=m[w]||[]).push(c.id)});return '<h1>Timeline</h1><table>'+Object.keys(m).sort().reverse().map(k=>`<tr><td>${k}</td><td>${m[k].length} claims</td><td style="width:50%">${mix(m[k])}</td></tr>`).join('')+'</table>'+filters()+list(D.claims.map(c=>c.id))}
function post(code){const p=D.posts[code];if(!p)return 'Not found';let imgs='';for(let i=1;i<=p.n;i++)imgs+=`<a href="../img/${code}/${String(i).padStart(2,'0')}.jpg" target="_blank"><img loading="lazy" src="../img/${code}/${String(i).padStart(2,'0')}.jpg" alt="slide ${i}"></a>`;
return `<h1>Post ${code}</h1><p>${p.date} . ${p.type} . <a href="${p.url}" target="_blank" rel="noopener">open on Instagram</a></p><div class="slides">${imgs}</div><h2>Claims from this post</h2>${list(D.claims.filter(c=>c.post===code).map(c=>c.id))}`}
function search(q){const t=q.toLowerCase();const ids=D.claims.filter(c=>(c.claim+' '+c.quote+' '+c.people.join(' ')+' '+c.subjects.join(' ')+' '+(c.orgs||[]).join(' ')).toLowerCase().includes(t)).map(c=>c.id);
const ppl=Object.keys(D.people).filter(n=>n.toLowerCase().includes(t));
return `<h1>Search: ${esc(q)}</h1>${ppl.length?'<div class="grid">'+ppl.map(n=>`<a class="pc" href="#/p/${enc(n)}"><b>${esc(n)}</b><small>${D.people[n].n} claims</small></a>`).join('')+'</div>':''}${filters()}${list(ids)}`}
function route(){const h=decodeURIComponent(location.hash.slice(1)||'/');const qv=document.getElementById('q').value.trim();let out;
if(h.startsWith('/search/'))out=search(h.slice(8));else if(h.startsWith('/p/'))out=person(h.slice(3));else if(h==='/cats')out=cats();else if(h.startsWith('/cat/'))out=cat(h.slice(5));else if(h==='/timeline')out=timeline();else if(h.startsWith('/post/'))out=post(h.slice(6));else out=home();
document.getElementById('app').innerHTML=out;
document.querySelectorAll('[data-st]').forEach(cb=>cb.onchange=()=>{cb.checked?st.add(cb.dataset.st):st.delete(cb.dataset.st);route()})}
let tm;document.getElementById('q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{const v=e.target.value.trim();location.hash=v?'#/search/'+enc(v):'#/'},250)};
window.onhashchange=route;route();
</script></body></html>
